services:
  indian-cinema:
    build: .
    image: indian-cinema:0.3.0
    environment:
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      CONFIG_SECRET: ${CONFIG_SECRET:?Set a permanent random CONFIG_SECRET in .env}
      KO_FI_URL: ${KO_FI_URL:-}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-}
      TMDB_CONCURRENCY: ${TMDB_CONCURRENCY:-}
      TMDB_QUEUE_LIMIT: ${TMDB_QUEUE_LIMIT:-}
      TMDB_CACHE_ENTRIES: ${TMDB_CACHE_ENTRIES:-}
      TMDB_PERSONAL_CACHE_ENTRIES: ${TMDB_PERSONAL_CACHE_ENTRIES:-}
      PERSONAL_CLIENT_LIMIT: ${PERSONAL_CLIENT_LIMIT:-}
      SEARCH_MAX_PAGES: ${SEARCH_MAX_PAGES:-}
      SETUP_RATE_LIMIT: ${SETUP_RATE_LIMIT:-}
      SETUP_CONCURRENCY: ${SETUP_CONCURRENCY:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-}
      LOGO_URL: ${LOGO_URL:-}
      HOST: 0.0.0.0
      PORT: "7000"
    ports:
      - "127.0.0.1:7001:7000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
